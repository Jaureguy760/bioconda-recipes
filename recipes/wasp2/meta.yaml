{# Version: keep in sync with rust/Cargo.toml (single source of truth) #}
{# Run scripts/check-version-consistency.sh to verify #}
{% set name = "wasp2" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9213ab3aaa087ad05bfe58e07ae8ab59687589740860e9fd6eaa5fec6730463f

build:
  number: 0
  skip: true  # [win or py < 311 or py > 312]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
    - cmake
    - make
    # bindgen 0.69 (via rust-htslib 1.0) is incompatible with libclang 22.
    # Clang 19 is required by the current conda-forge macOS compiler stack.
    - clangdev >=18,<20
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - crossenv                            # [build_platform != target_platform]
    - maturin >=1.6,<2.0                  # [build_platform != target_platform]
  host:
    - python
    - pip
    - maturin >=1.6,<2.0
    - bzip2
    - xz
    - zlib
    - openssl  # [not osx]
    - libcurl
  run:
    - python >=3.11,<3.13.0a0
    # Data processing
    - numpy >=1.21.0
    - pandas >=1.5.0,<3.0.0
    - polars >=1.0.0,<2.0
    - scipy >=1.13.1
    # Bioinformatics
    - pysam >=0.21.0
    - pybedtools >=0.9.0
    - anndata >=0.8.0,<0.12.0
    - scanpy >=1.10.0
    - numba >=0.59.0,<0.63.0  # [osx and x86_64]
    - numba >=0.59.0          # [not (osx and x86_64)]
    # CLI
    - typer >=0.12.0
    - rich >=13.0.0
    # External tools (bioconda)
    - samtools >=1.10
    - bcftools
    - bedtools

test:
  imports:
    - counting
    - mapping
    - analysis
    - wasp2_rust
    - wasp2
  requires:
    - bwa
  source_files:
    - scripts/container_smoke_test.sh
    - tests/shared_data/sample1.bam*
    - tests/shared_data/variants.vcf.gz*
  commands:
    - wasp2-count --help
    - wasp2-map --help
    - wasp2-analyze --help
    - EXPECTED_WASP2_VERSION={{ version }} bash scripts/container_smoke_test.sh

about:
  home: https://github.com/mcvickerlab/WASP2
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - rust/licenses/SCIPY-LICENSE.txt
    - rust/licenses/NUMPY-LICENSE.txt
  summary: Allele-specific analysis of next-generation sequencing data with Rust acceleration
  description: |
    WASP2 is a high-performance tool for allele-specific analysis of NGS data.
    It provides functionality for variant counting, read remapping for bias
    correction, and statistical analysis of allelic imbalance. The package
    includes a Rust extension for accelerated BAM processing.
  doc_url: https://mcvickerlab.github.io/WASP2/
  dev_url: https://github.com/mcvickerlab/WASP2

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - Jaureguy760
  identifiers:
    - biotools:wasp2
